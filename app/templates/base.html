<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Podcast Processor{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
    {% block head %}{% endblock %}
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">Podcast Processor</a>
      {% if request.session.get('authenticated') %}
      <form method="post" action="/logout">
        <input type="hidden" name="csrf" value="{{ csrf_token }}">
        <button class="link-button" type="submit">Sign out</button>
      </form>
      {% endif %}
    </header>
    <main class="container">
      {% if runtime_issues %}
      <aside class="alert warning">
        <strong>Setup needed:</strong> {{ runtime_issues | join('; ') }}
      </aside>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
